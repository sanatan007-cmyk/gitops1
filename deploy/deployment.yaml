apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitops1
  template:
    metadata:
      labels:
        app: gitops1
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: gitops1
          image: gitops1:latest
          ports:
            - containerPort: 8080
