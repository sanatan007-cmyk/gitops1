apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gitops1
  template:
    metadata:
      labels:
        app: gitops1
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: gitops1
          image: ghcr.io/sanatan007-cmyk/gitops1:643caaada5c1efd57393d4a55121f985dfb7bab9
          ports:
            - containerPort: 8080
