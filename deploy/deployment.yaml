apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{values.appname}}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${{values.appname}}
  template:
    metadata:
      labels:
        app: ${{values.appname}}
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: ${{values.appname}}
          image: ${{values.appname}}:latest
          ports:
            - containerPort: 8080
