apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitops1
  template:
    metadata:
      labels:
        app: gitops1
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: gitops1
          image: ghcr.io/sanatan007-cmyk/gitops1:7cc96fca07099e2a1cb970159746cb14464aef9c
          ports:
            - containerPort: 8080
